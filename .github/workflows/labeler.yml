name: Labeler

# Auto-labels PRs by area (.github/labeler.yml) and by size. Uses
# pull_request_target, so it activates on PRs opened after this lands on main.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  area:
    name: Area labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5

  size:
    name: Size label
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
