version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - TTS_PROVIDER=${TTS_PROVIDER:-edge}
      - FORCE_EDGE_TTS=${FORCE_EDGE_TTS:-true}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_PATH=/app/data/book2audio.db
    volumes:
      - audio_output:/app/output
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_URL=http://backend:8000
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  audio_output:
  db_data:
