<!DOCTYPE html>
<html>
<head><title>Audio Debug</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:20px">
<h2>Audio Debug Tool</h2>
<div id="log"></div>
<script>
function log(msg) {
  document.getElementById('log').innerHTML += msg + '<br>';
  console.log(msg);
}

let audioElement = null;

async function test() {
  log('1. Fetching /api/auth/me to check auth...');
  try {
    const meRes = await fetch('/api/auth/me', { credentials: 'include' });
    const me = await meRes.json();
    log('   Auth: ' + JSON.stringify(me));
  } catch(e) {
    log('   Auth failed: ' + e.message);
    return;
  }

  log('2. Fetching /api/library...');
  const libRes = await fetch('/api/library', { credentials: 'include' });
  const lib = await libRes.json();
  const docs = lib.documents || [];
  log('   Found ' + docs.length + ' documents');

  const completed = docs.find(d => d.status === 'completed');
  if (!completed) {
    log('   ERROR: No completed documents found');
    return;
  }
  log('   Using doc: ' + completed.id + ' (' + completed.title + ')');

  log('3. Fetching audio blob...');
  const dlRes = await fetch('/api/download/' + completed.id, { credentials: 'include' });
  log('   Status: ' + dlRes.status);
  log('   Content-Type: ' + dlRes.headers.get('content-type'));
  log('   Content-Length: ' + dlRes.headers.get('content-length'));

  const blob = await dlRes.blob();
  log('   Blob size: ' + blob.size + ', type: "' + blob.type + '"');

  const url = URL.createObjectURL(blob);
  log('   Blob URL: ' + url);

  log('4. Setting up audio element...');
  audioElement = new Audio();

  audioElement.addEventListener('loadedmetadata', () => {
    log('   EVENT loadedmetadata: duration=' + audioElement.duration);
  });
  audioElement.addEventListener('canplay', () => {
    log('   EVENT canplay - ready to play');
  });
  audioElement.addEventListener('playing', () => {
    log('   EVENT playing - audio is now playing!');
  });
  audioElement.addEventListener('timeupdate', () => {
    if (Math.floor(audioElement.currentTime) % 1 === 0) {
      log('   EVENT timeupdate: ' + audioElement.currentTime.toFixed(2) + 's');
    }
  });
  audioElement.addEventListener('error', () => {
    log('   EVENT error: ' + (audioElement.error?.message || 'unknown') + ' code=' + audioElement.error?.code);
  });
  audioElement.addEventListener('stalled', () => {
    log('   EVENT stalled - browser trying to fetch but no data');
  });

  audioElement.src = url;
  audioElement.volume = 1;
  log('   Audio element ready. Blob loaded.');
  log('');
  log('   ▼▼▼ CLICK THE BUTTON BELOW TO PLAY ▼▼▼');
}

async function doPlay() {
  if (!audioElement) { log('ERROR: audio not loaded yet'); return; }
  log('');
  log('=== PLAY BUTTON CLICKED (user gesture) ===');
  log('   Calling audio.play()...');
  try {
    await audioElement.play();
    log('   ✓ play() resolved - audio should be playing');
    log('   paused=' + audioElement.paused);
    log('   volume=' + audioElement.volume);
    log('   muted=' + audioElement.muted);
    log('   currentTime=' + audioElement.currentTime);
    log('   duration=' + audioElement.duration);
    log('   readyState=' + audioElement.readyState);
  } catch(e) {
    log('   ✗ play() REJECTED: ' + e.name + ': ' + e.message);
  }

  setTimeout(() => {
    log('');
    log('=== 3 SECONDS LATER ===');
    log('   currentTime=' + audioElement.currentTime.toFixed(2));
    log('   paused=' + audioElement.paused);
    if (audioElement.currentTime > 0.5) {
      log('   ✓✓✓ AUDIO IS WORKING! You should hear sound. ✓✓✓');
    } else if (!audioElement.paused) {
      log('   ⚠️ Says playing but time not advancing - DECODE ISSUE');
    } else {
      log('   ✗ Audio is paused - browser blocked playback');
    }
  }, 3000);
}

test();
</script>
<br><br>
<button onclick="doPlay()" style="font-size:24px;padding:20px 40px;cursor:pointer;background:#7c3aed;color:white;border:none;border-radius:12px;margin-top:10px">
  ▶ CLICK HERE TO PLAY AUDIO
</button>
</body>
</html>
