<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable: same mark scaled into the inner ~66% safe area so a circular
       Android mask never clips the letter or waveform. Full-bleed ink ground. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D08A3E"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#16130f"/>
  <g transform="translate(256,256) scale(0.62) translate(-256,-256)">
    <rect x="150" y="112" width="212" height="288" rx="10" fill="#211e1a" stroke="rgba(244,241,234,0.12)" stroke-width="2"/>
    <line x1="188" y1="140" x2="188" y2="372" stroke="rgba(180,83,9,0.35)" stroke-width="3"/>
    <text x="196" y="332" font-family="Playfair Display, Georgia, serif" font-size="252" font-weight="800" fill="#f4f1ea">B</text>
    <g fill="url(#gold)">
      <rect x="128" y="240" width="9" height="32" rx="4"/>
      <rect x="150" y="220" width="9" height="72" rx="4"/>
      <rect x="172" y="248" width="9" height="16" rx="4"/>
      <rect x="326" y="230" width="9" height="52" rx="4"/>
      <rect x="348" y="212" width="9" height="88" rx="4"/>
      <rect x="370" y="244" width="9" height="24" rx="4"/>
    </g>
  </g>
</svg>
