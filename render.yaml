services:
  - type: web
    name: book2audio-backend
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python: libsql-experimental (Turso client) has no wheel for 3.14 and
      # can't compile in the build image. Keep in sync with backend/Dockerfile
      # and backend/runtime.txt.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TTS_PROVIDER
        value: edge
      # Use edge-tts for conversions (real neural voices, no gTTS rate-limits).
      # Verified reachable from this Render host. Falls back to gTTS per-chunk
      # if edge ever fails.
      - key: FORCE_EDGE_TTS
        value: "true"
      # Signs the session cookie. Keep STABLE across deploys (see
      # DEPLOYMENT_PERSISTENCE.md) — generateValue is fine as long as Render
      # keeps it, which it does after first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: ./data/book2audio.db
      # --- Persistent storage (optional; see DEPLOYMENT_PERSISTENCE.md) ---
      # Set these to survive free-tier redeploys. Unset = local ephemeral disk.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: AUDIO_BUCKET
        sync: false
      - key: AUDIO_S3_ENDPOINT
        sync: false
      - key: AUDIO_S3_KEY_ID
        sync: false
      - key: AUDIO_S3_SECRET_KEY
        sync: false
      - key: AUDIO_S3_REGION
        sync: false
